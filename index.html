<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/spinel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinel</title>
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('spinel-theme');
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
